# Render Blueprint — provisions the web service AND the PostgreSQL database
# in one click ("New +" -> "Blueprint" in the Render dashboard).
#
# Free plans are used so the assessment link stays live; swap `plan: starter`
# for production use. See README -> "Deployment & CI/CD".
services:
  - type: web
    name: clinic-booking-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true # push to main -> automatic deploy
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clinic-booking-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.6"

databases:
  - name: clinic-booking-db
    plan: free
    databaseName: clinicdb
    user: clinicapp
